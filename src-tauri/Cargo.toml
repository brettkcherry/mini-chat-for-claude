[package]
# Internal crate name stays "claude-mini" — the public-facing name is
# "Mini for Claude" (productName in tauri.conf.json). Keeping the crate,
# identifier, and keyring service stable preserves existing user data.
name = "claude-mini"
version = "0.4.3"
description = "Mini Chat for Claude — a tiny floating desktop chat widget for Claude"
authors = ["Brett Cherry"]
edition = "2021"
# Matches ../LICENSE. Absent, the crate's own licence was simply unstated —
# `cargo deny check licenses` reads that as unlicensed, which is the correct
# reading: "no field" and "permissively licensed" are not the same claim.
license = "MIT"
# An application, not a library. Nothing here is meant for crates.io, and
# saying so keeps a stray `cargo publish` from being the way that's discovered.
publish = false

# Binary entry — this file plus lib.rs is the standard Tauri 2 split.
[[bin]]
name = "claude-mini"
path = "src/main.rs"

# Library — Tauri's mobile story expects this even on desktop-only apps.
[lib]
name = "claude_mini_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Anthropic streaming client
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
futures-util = "0.3"

# API key storage — Windows Credential Manager / macOS Keychain.
# Linux port (v0.2): add "sync-secret-service" feature (GNOME Keyring/KWallet
# via DBus; needs libdbus dev package at build time). Don't use "linux-native"
# — that's kernel keyutils, which forgets keys on reboot.
keyring = { version = "3", features = ["windows-native", "apple-native"] }
tauri-plugin-dialog = "2.7.2"

# Linux port, read this first: Cargo.lock carries the whole GTK/WebKit stack
# (gtk, webkit2gtk, glib, ...) because a lockfile records the union of every
# platform's dependencies, not just the one being built. None of it compiles
# into the Windows build — `cargo tree --target x86_64-pc-windows-msvc` finds
# zero glib, against 29 hits for the linux-gnu target.
#
# That distinction is why Dependabot alert #6 (GHSA-wrw7-89jp-8q8g /
# RUSTSEC-2024-0429, unsoundness in `glib::VariantStrIter`'s iterator impls)
# was dismissed as not-used rather than fixed. It cannot be fixed here in any
# case: gtk 0.18.2 requires glib ^0.18 and tauri 2.11.5 pins that gtk, so the
# patched 0.20 is unreachable until Tauri moves off gtk3-rs upstream.
#
# The moment this app actually targets Linux, that reasoning expires — glib
# starts shipping to users and the advisory needs re-deciding on its merits.
# Note it is an *unsoundness* advisory, not an exploitable vulnerability,
# which is why cargo-audit passes green while Dependabot flags it; the two
# classify informational RustSec advisories differently.

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"      # optimize for binary size — we want this tiny
strip = true
