# Config for `cargo about generate` — used to produce NOTICE.md's Rust
# dependency section. Regenerate with:
#   cargo about generate about.hbs -o ../NOTICE-rust.md --manifest-path Cargo.toml
#
# Every license below is permissive (or, for the two non-OR entries —
# Unicode-3.0 and CDLA-Permissive-2.0 — was individually reviewed and
# confirmed to carry no obligations beyond attribution). None are copyleft.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "MIT-0",
    "BSL-1.0",
    # Only reached via an OR with MIT/Apache-2.0 above, never as a sole
    # license in this dependency tree — see the generated output's
    # per-crate license column to confirm before ever depending on a
    # crate that requires this alone.
    "LGPL-2.1-or-later",
]

ignore-build-dependencies = false
ignore-dev-dependencies = true
