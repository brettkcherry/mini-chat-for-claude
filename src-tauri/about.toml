# Config for `cargo about generate` — used to produce NOTICE.md's Rust
# dependency section. Regenerate with:
#   cargo about generate about.hbs -o ../NOTICE-rust.md --manifest-path Cargo.toml
#
# Every license below is permissive, with one exception: MPL-2.0 (weak,
# file-level copyleft — see deny.toml for why that's fine here). The three
# non-OR entries besides it — Unicode-3.0, CDLA-Permissive-2.0, and MPL-2.0
# itself — were each individually reviewed and confirmed to carry no
# obligation beyond attribution (source availability, for MPL-2.0) given
# these crates are consumed unmodified. None are GPL, AGPL, or LGPL.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "MIT-0",
    "BSL-1.0",
    # Only reached via an OR with MIT/Apache-2.0 above, never as a sole
    # license in this dependency tree — see the generated output's
    # per-crate license column to confirm before ever depending on a
    # crate that requires this alone.
    "LGPL-2.1-or-later",
]

ignore-build-dependencies = false
ignore-dev-dependencies = true
