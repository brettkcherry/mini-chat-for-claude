name: Release

# Builds the Windows installer and drafts a GitHub Release whenever a
# version tag (v0.2.0, v1.0.0, ...) is pushed. The draft lets you write
# release notes before publishing.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY          — contents of ~/.tauri/mini-for-claude.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — empty string (key has no password)
# These sign the UPDATE artifacts (latest.json) so installed apps can
# verify updates. This is separate from Windows code signing.
#
# Every action below is pinned to a full commit SHA, not a tag. Tags are
# mutable — whoever controls the action's repo can repoint v4 at new code
# any time. This job holds TAURI_SIGNING_PRIVATE_KEY, the key that
# authorizes auto-updates to every installed copy of the app, so a
# retagged action would be a straight path to shipping a malicious
# update. The trailing comment records which tag each SHA came from;
# Dependabot reads that format and keeps both in sync.

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # `stable` here was a branch, not even a tag — it moved under us on
      # every toolchain release.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Mini Chat for Claude ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
