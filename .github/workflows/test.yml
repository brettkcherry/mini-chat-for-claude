name: Test

# Runs on every push and PR so a broken build or a known-vulnerable
# dependency can't reach a version tag undetected. release.yml has no gate
# of its own — it just builds and ships whatever the tag points at.
#
# Three independent jobs:
#   - rust-tests:  cargo test on Windows (the app only ships for Windows,
#                  and keyring's windows-native feature makes Windows the
#                  only runner that reflects production).
#   - npm-audit:   fails on any moderate+ vulnerability in a dependency
#                  that actually ships (--omit=dev excludes vite/postcss,
#                  which are build-time only and never reach users).
#   - cargo-audit: rustsec/audit-check reads Cargo.lock against the
#                  RustSec advisory database directly — a different data
#                  source than npm's.
#                  There is deliberately no `ignore:` list. RUSTSEC-2026-0185
#                  (quinn-proto) used to be excepted here because fixing it
#                  forced a rand 0.9->0.10 bump repo-wide for a crate nothing
#                  references. That bump has since been taken and everything
#                  still compiles and passes, so the exception is gone rather
#                  than being carried forward. Keep it that way: an ignore
#                  list is a place for real findings to hide.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - run: cargo test --manifest-path src-tauri/Cargo.toml

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # --ignore-scripts: install hooks are where a compromised package puts
      # its payload. Nothing in this tree declares one, so skipping them
      # changes nothing about the build and closes the hole. Same flag in
      # release.yml, where it matters more — that job holds the signing key.
      - run: npm ci --ignore-scripts

      # --omit=dev: vite/postcss are build-time only and never ship in the
      # installer. A moderate+ finding in dompurify/marked/@tauri-apps/api
      # fails the build; dev-only findings don't block.
      - run: npm audit --omit=dev --audit-level=moderate

  cargo-audit:
    runs-on: ubuntu-latest
    # rustsec/audit-check posts its result as a GitHub Check Run, which
    # needs its own explicit grant — GITHUB_TOKEN's default contents:write
    # (from a push to main) doesn't imply checks:write. Without this the
    # audit itself passes clean but the job still fails with "Resource not
    # accessible by integration", which reads exactly like a real finding
    # until you open the log and see "No vulnerabilities were found" one
    # line above the error.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

  # Licence policy, not vulnerabilities — cargo-audit above answers "is anything
  # known-broken?", this answers "may we actually ship this?". Mini Chat is MIT,
  # which is a narrow outbound licence: it absorbs permissive dependencies but a
  # strong-copyleft one would make the binary undistributable under the terms
  # LICENSE claims. about.toml GENERATES the notices; this FAILS the build, and
  # only the second one catches a transitive crate that arrived in a routine
  # `cargo update`. Policy and reasoning live in src-tauri/deny.toml.
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check licenses
